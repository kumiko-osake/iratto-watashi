<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff7aa2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="イラッと、わたし。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>イラッと、わたし。</title>
<style>
:root{
 --bg1:#fff7fb;--bg2:#fff4e8;--card:#fffdfb;--ink:#4a3440;--muted:#9a7a86;
 --pink:#ff7aa2;--pink2:#ff9db8;--rose:#e85f89;--peach:#ffc59f;--gold:#ffd76a;
 --lav:#efe4ff;--soft:#ffe7ef;--line:#f1d6df;--danger:#c9506c;--mint:#e9f8ef;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:var(--ink);background:
 radial-gradient(circle at 15% 5%,rgba(255,215,106,.25),transparent 25%),
 radial-gradient(circle at 90% 15%,rgba(239,228,255,.55),transparent 28%),
 linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(255,247,251,.92);backdrop-filter:blur(14px);padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.titlewrap{display:flex;align-items:center;gap:10px}.miniFace{width:48px;height:48px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#ffb8cc,#ff7aa2);box-shadow:0 8px 18px rgba(255,122,162,.25);font-size:25px;border:3px solid white;transform:rotate(-3deg)}
h1{font-size:23px;margin:0 0 3px}.sub{font-size:11px;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}nav button{border:0;border-radius:15px;padding:10px 4px;background:#fff0f5;color:var(--ink);font-weight:800}nav button.active{background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff;box-shadow:0 6px 14px rgba(232,95,137,.22)}
main{max-width:760px;margin:auto;padding:14px 14px 44px}section{display:none}.show{display:block}.card{background:rgba(255,253,251,.96);border:1px solid var(--line);border-radius:26px;padding:16px;margin-bottom:14px;box-shadow:0 10px 28px rgba(202,112,141,.08)}
.hero{text-align:center;position:relative;overflow:hidden;padding:18px 15px 17px}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(.2px)}.hero:before{width:170px;height:170px;right:-60px;top:-70px;background:rgba(255,215,106,.18)}.hero:after{width:120px;height:120px;left:-45px;bottom:-35px;background:rgba(239,228,255,.55)}
.spark{font-size:15px;letter-spacing:5px;color:#d78b33}.today{font-size:14px;color:var(--muted)}.count{font-size:58px;font-weight:900;color:var(--rose);margin:3px 0 0;text-shadow:0 2px 0 #fff}.count small{font-size:18px;color:var(--ink)}
.iratBtn{width:min(325px,84vw);aspect-ratio:1/1;border-radius:50%;border:8px solid white;background:radial-gradient(circle at 32% 25%,#ffd4df 0%,#ffabc2 30%,#ff7aa2 62%,#e85f89 100%);color:white;box-shadow:0 18px 38px rgba(232,95,137,.34), inset 0 3px 0 rgba(255,255,255,.55);margin:8px auto 9px;display:grid;place-items:center;touch-action:manipulation;position:relative;transition:.12s transform}.iratBtn:active{transform:scale(.95)}
.iratBtn:before,.iratBtn:after{content:"✦";position:absolute;color:#fff6bc;font-size:22px}.iratBtn:before{top:42px;left:55px}.iratBtn:after{right:52px;bottom:58px}.btnInner{display:flex;flex-direction:column;align-items:center}.btnFace{font-size:52px}.btnLabel{font-size:38px;font-weight:900;line-height:1.05}.btnSub{font-size:13px;font-weight:800;margin-top:9px;background:rgba(255,255,255,.18);padding:6px 10px;border-radius:999px}
.tip{display:inline-block;background:#fff8dd;border:1px solid #f2df9d;color:#8a694e;border-radius:999px;padding:7px 12px;font-size:12px;margin:5px 0 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.primary,.secondary,.danger,.ghost{border:0;border-radius:15px;padding:12px 13px;font-size:14px;font-weight:800}.primary{background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff}.secondary{background:var(--soft);color:var(--ink)}.danger{background:#f9e3e9;color:var(--danger)}.ghost{background:#f5f0ff;color:#645273}.small{font-size:12px;color:var(--muted);line-height:1.65}
h2{font-size:18px;margin:0 0 12px}.sectionTitle{display:flex;align-items:center;gap:8px}.sectionIcon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#f3eaff,#ffe8ef);font-size:18px}
.event{border-top:1px dashed var(--line);padding:13px 0}.event:first-child{border-top:0}.eventHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.time{font-weight:900;color:var(--rose);font-size:18px}.badges{margin-top:5px}.badge{display:inline-block;background:#fff0f5;border:1px solid #f7dbe4;padding:6px 9px;border-radius:999px;font-size:12px;margin:4px 4px 0 0}.badge.gold{background:#fff8dd;border-color:#f4e4ad}.badge.lav{background:#f5efff;border-color:#e6d9ff}.badge.mint{background:#eefaf2;border-color:#d8efdf}
.eventNote{margin-top:8px;background:#fffaf7;border-left:4px solid var(--pink2);padding:9px 10px;border-radius:10px;font-size:13px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:linear-gradient(145deg,#fff0f5,#fff8e5);border-radius:18px;padding:14px}.stat b{display:block;font-size:28px;color:var(--rose)}.empty{text-align:center;color:var(--muted);padding:24px 8px}
.todaySummary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}.miniStat{padding:11px;border-radius:16px;background:#fff4f7;text-align:center}.miniStat b{display:block;font-size:20px;color:var(--rose)}
label{display:block;font-size:13px;margin:10px 0 5px;color:#634d56}select,textarea,input[type=text]{width:100%;border:1px solid var(--line);background:white;border-radius:13px;padding:12px;font-size:16px;color:var(--ink)}textarea{min-height:82px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{position:relative}.chip input{position:absolute;opacity:0;pointer-events:none}.chip span{display:inline-block;border:1px solid var(--line);background:white;border-radius:999px;padding:9px 12px;font-size:14px}.chip input:checked+span{background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff;border-color:transparent}
.modal{position:fixed;inset:0;background:rgba(69,43,54,.36);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:10px}.modal.show{display:flex}.sheet{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fffdfb;border-radius:28px 28px 18px 18px;padding:18px;box-shadow:0 -8px 34px rgba(88,49,65,.22)}.sheetHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.closeBtn{border:0;background:#fff0f5;border-radius:50%;width:38px;height:38px;font-size:20px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.notice{background:#fff8dd;border:1px solid #f1dfa6;border-radius:15px;padding:11px 12px;font-size:12px;line-height:1.6;margin-bottom:12px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:8px 18px 30px}@media(max-width:520px){.formGrid{grid-template-columns:1fr}.todaySummary{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
 <div class="titlewrap"><div class="miniFace">😤</div><div><h1>イラッと、わたし。♡</h1><div class="sub">その場では、ぽんっ。夜にゆっくり振り返る。</div></div></div>
 <nav><button class="active" data-tab="tap">押す</button><button data-tab="history">振り返る</button><button data-tab="insight">傾向</button></nav>
</header>
<main>
<section id="tap" class="show">
 <div class="card hero">
  <div class="spark">✦ ♡ ✦</div><div class="today" id="todayLabel"></div>
  <div class="count"><span id="todayCount">0</span><small> 回</small></div>
  <button class="iratBtn" id="iratBtn"><span class="btnInner"><span class="btnFace">😤</span><span class="btnLabel">イラッ！</span><span class="btnSub">ここをぽんっ</span></span></button>
  <div class="tip">押した時刻は自動で残るよ ♡</div>
  <div class="actions"><button class="secondary" id="undoBtn">↩ 1回もどす</button><button class="secondary" id="resetTodayBtn">今日を0回に</button></div>
 </div>
 <div class="card"><h2 class="sectionTitle"><span class="sectionIcon">📝</span>今日のイラッ</h2><div id="todaySummary"></div><div id="todayEvents"></div></div>
</section>
<section id="history">
 <div class="card"><h2 class="sectionTitle"><span class="sectionIcon">🌙</span>1日を振り返る</h2><div class="notice">その場では何も書かなくてOK。夜や落ち着いた時に、思い出せる分だけ追記できます。</div><div id="historyList"></div></div>
</section>
<section id="insight">
 <div class="card"><h2 class="sectionTitle"><span class="sectionIcon">🔎</span>わたしの傾向</h2><div id="stats"></div><div id="patterns"></div></div>
 <div class="card"><h2 class="sectionTitle"><span class="sectionIcon">💾</span>データを守る</h2><p class="small">記録はこの端末のブラウザ内に保存されます。時々バックアップしてください。</p><button class="secondary" id="exportBtn">バックアップを書き出す</button><label>バックアップを戻す</label><input type="file" id="importFile" accept=".json,application/json"></div>
</section>
</main>

<div class="modal" id="detailModal" aria-hidden="true">
 <div class="sheet">
  <div class="sheetHead"><div><div class="small" id="modalTime"></div><h2 style="margin:2px 0 0">このイラッを振り返る</h2></div><button class="closeBtn" id="closeModal">×</button></div>
  <div class="formGrid">
   <div><label>誰といる時？</label><select id="person"><option value="">選ばなくてもOK</option><option>夫・パートナー</option><option>家族</option><option>友人</option><option>仕事関係</option><option>お店・サービスの人</option><option>知らない人</option><option>自分自身</option><option>ひとりの時</option><option>その他</option></select></div>
   <div><label>どこ・どんな場面？</label><select id="situation"><option value="">選ばなくてもOK</option><option>家</option><option>外出先</option><option>買い物</option><option>飲食店</option><option>病院</option><option>移動中</option><option>電話</option><option>LINE・メッセージ</option><option>SNS</option><option>仕事・作業中</option><option>その他</option></select></div>
  </div>
  <label>イラッと度</label>
  <div class="chips" id="levelChips">
   <label class="chip"><input type="radio" name="level" value="ちょいイラ"><span>😐 ちょいイラ</span></label>
   <label class="chip"><input type="radio" name="level" value="かなりイラ"><span>😤 かなりイラ</span></label>
   <label class="chip"><input type="radio" name="level" value="爆発寸前"><span>😡 爆発寸前</span></label>
  </div>
  <label>何があった？</label><textarea id="whatHappened" placeholder="例：同じことを何度も言われた、待たされた、言い方が嫌だった…"></textarea>
  <label>その時どうした？</label>
  <div class="chips" id="responseChips">
   <label class="chip"><input type="radio" name="response" value="我慢した"><span>我慢した</span></label>
   <label class="chip"><input type="radio" name="response" value="言い返した"><span>言い返した</span></label>
   <label class="chip"><input type="radio" name="response" value="その場を離れた"><span>その場を離れた</span></label>
   <label class="chip"><input type="radio" name="response" value="無視した"><span>無視した</span></label>
   <label class="chip"><input type="radio" name="response" value="笑って流した"><span>笑って流した</span></label>
   <label class="chip"><input type="radio" name="response" value="あとで話した"><span>あとで話した</span></label>
   <label class="chip"><input type="radio" name="response" value="その他"><span>その他</span></label>
  </div>
  <label>あとで思ったこと・ひとこと</label><textarea id="note" placeholder="例：疲れていたかも。本当は悲しかった。次は少し離れよう。"></textarea>
  <div class="formActions"><button class="secondary" id="cancelDetail">キャンセル</button><button class="primary" id="saveDetail">保存する</button></div>
 </div>
</div>

<footer>試作版 v0.3　※感情の記録・振り返り用です。</footer>
<script>
const KEY='iratto_watashi_v01';
const $=id=>document.getElementById(id);let editingId=null;
function getData(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function setData(v){localStorage.setItem(KEY,JSON.stringify(v))}
function dateKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function timeStr(d=new Date()){return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function fmtDate(s){const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function normalize(e){return {person:'',situation:'',level:e.level||'',what:e.what||e.trigger||'',response:'',note:e.note||'',...e}}
function todayItems(){const k=dateKey();return getData().map(normalize).filter(x=>x.date===k)}
function detailBadges(e){let out='';if(e.person)out+=`<span class="badge gold">👥 ${escapeHtml(e.person)}</span>`;if(e.situation)out+=`<span class="badge lav">📍 ${escapeHtml(e.situation)}</span>`;if(e.level)out+=`<span class="badge">${escapeHtml(e.level)}</span>`;if(e.response)out+=`<span class="badge mint">→ ${escapeHtml(e.response)}</span>`;return out}
function renderTap(){const now=new Date(),items=todayItems();$('todayLabel').textContent=`${now.getMonth()+1}月${now.getDate()}日`;$('todayCount').textContent=items.length;$('todaySummary').innerHTML=`<div class="todaySummary"><div class="miniStat"><span class="small">今日の回数</span><b>${items.length}</b></div><div class="miniStat"><span class="small">詳細を書いた</span><b>${items.filter(x=>x.person||x.situation||x.level||x.what||x.response||x.note).length}</b></div></div>`;const box=$('todayEvents');if(!items.length){box.innerHTML='<div class="empty">まだ今日は押していません。</div>';return}box.innerHTML=items.slice().reverse().map(e=>`<div class="event"><div class="eventHead"><div><div class="time">${escapeHtml(e.time)}</div><div class="small">${e.person||e.situation||e.what?'あとで記録済み':'あとで思い出して書けます'}</div></div><button class="primary" onclick="openDetail('${e.id}')">${e.person||e.situation||e.what||e.level||e.response||e.note?'編集':'詳しく書く'}</button></div><div class="badges">${detailBadges(e)}</div>${e.what?`<div class="eventNote"><b>何があった？</b><br>${escapeHtml(e.what)}</div>`:''}${e.note?`<div class="eventNote"><b>あとで思ったこと</b><br>${escapeHtml(e.note)}</div>`:''}</div>`).join('')}
$('iratBtn').onclick=()=>{const d=new Date(),data=getData();data.push({id:Date.now().toString(),date:dateKey(d),time:timeStr(d),timestamp:d.toISOString(),person:'',situation:'',level:'',what:'',response:'',note:''});setData(data);if(navigator.vibrate)navigator.vibrate(40);renderTap()}
$('undoBtn').onclick=()=>{let d=getData();const k=dateKey();for(let i=d.length-1;i>=0;i--){if(d[i].date===k){d.splice(i,1);break}}setData(d);renderTap()}
$('resetTodayBtn').onclick=()=>{if(!confirm('今日の記録だけ0回に戻しますか？'))return;const k=dateKey();setData(getData().filter(x=>x.date!==k));renderTap();renderHistory();renderInsights()}
function resetModal(){editingId=null;$('person').value='';$('situation').value='';$('whatHappened').value='';$('note').value='';document.querySelectorAll('input[name=level],input[name=response]').forEach(x=>x.checked=false)}
window.openDetail=id=>{const e=getData().map(normalize).find(x=>x.id===id);if(!e)return;editingId=id;$('modalTime').textContent=`${e.date} ${e.time}`;$('person').value=e.person||'';$('situation').value=e.situation||'';$('whatHappened').value=e.what||'';$('note').value=e.note||'';document.querySelectorAll('input[name=level]').forEach(x=>x.checked=x.value===e.level);document.querySelectorAll('input[name=response]').forEach(x=>x.checked=x.value===e.response);$('detailModal').classList.add('show');$('detailModal').setAttribute('aria-hidden','false')}
function closeModal(){ $('detailModal').classList.remove('show');$('detailModal').setAttribute('aria-hidden','true');resetModal() }
$('closeModal').onclick=closeModal;$('cancelDetail').onclick=closeModal;$('detailModal').onclick=e=>{if(e.target===$('detailModal'))closeModal()}
$('saveDetail').onclick=()=>{if(!editingId)return;const d=getData(),i=d.findIndex(x=>x.id===editingId);if(i<0)return;const level=document.querySelector('input[name=level]:checked');const response=document.querySelector('input[name=response]:checked');d[i]={...normalize(d[i]),person:$('person').value,situation:$('situation').value,level:level?level.value:'',what:$('whatHappened').value.trim(),response:response?response.value:'',note:$('note').value.trim()};setData(d);closeModal();renderTap();renderHistory();renderInsights()}
function grouped(){const g={};getData().map(normalize).forEach(x=>(g[x.date]||(g[x.date]=[])).push(x));return g}
function renderHistory(){const d=getData().map(normalize),box=$('historyList');if(!d.length){box.innerHTML='<div class="empty">まだ記録がありません。</div>';return}const g=grouped();box.innerHTML=Object.keys(g).sort().reverse().map(day=>`<div class="event"><div class="eventHead"><div><b>${escapeHtml(day)}</b><div class="small">この日の記録をあとから追記できます</div></div><span class="badge">${g[day].length}回</span></div>${g[day].slice().reverse().map(e=>`<div style="margin-top:10px;padding:10px;border-radius:14px;background:#fffafc"><div class="eventHead"><div class="time">${escapeHtml(e.time)}</div><button class="secondary" onclick="openDetail('${e.id}')">${e.person||e.situation||e.what||e.level||e.response||e.note?'編集':'詳しく書く'}</button></div><div class="badges">${detailBadges(e)}</div>${e.what?`<div class="eventNote">${escapeHtml(e.what)}</div>`:''}</div>`).join('')}</div>`).join('')}
function topEntry(obj){return Object.entries(obj).sort((a,b)=>b[1]-a[1])[0]}
function countField(d,key){const o={};d.forEach(x=>{if(x[key])o[x[key]]=(o[x[key]]||0)+1});return o}
function renderInsights(){const d=getData().map(normalize),s=$('stats'),p=$('patterns');if(!d.length){s.innerHTML='<div class="empty">記録が増えると傾向が見えます。</div>';p.innerHTML='';return}const g=grouped(),days=Object.keys(g),maxDay=days.slice().sort((a,b)=>g[b].length-g[a].length)[0];const hours={};d.forEach(x=>{const h=x.time.slice(0,2);hours[h]=(hours[h]||0)+1});const topHour=topEntry(hours);const weekdays=['日','月','火','水','木','金','土'],wd={};d.forEach(x=>{const w=weekdays[new Date(x.date+'T00:00:00').getDay()];wd[w]=(wd[w]||0)+1});const topWd=topEntry(wd),topPerson=topEntry(countField(d,'person')),topSituation=topEntry(countField(d,'situation')),topLevel=topEntry(countField(d,'level'));s.innerHTML=`<div class="stats"><div class="stat"><span class="small">総イラッ回数</span><b>${d.length}</b>回</div><div class="stat"><span class="small">記録した日</span><b>${days.length}</b>日</div><div class="stat"><span class="small">多い時間帯</span><b>${topHour?topHour[0]+'時':'—'}</b></div><div class="stat"><span class="small">最多の日</span><b>${g[maxDay].length}</b>回</div></div>`;const msgs=[];if(topWd)msgs.push(`いちばん多い曜日：${topWd[0]}曜日`);if(topPerson)msgs.push(`いちばん多い「誰と」：${topPerson[0]}`);if(topSituation)msgs.push(`いちばん多い場面：${topSituation[0]}`);if(topLevel)msgs.push(`いちばん多い強さ：${topLevel[0]}`);msgs.push(`最多日：${fmtDate(maxDay)} ${g[maxDay].length}回`);p.innerHTML='<h3>見えてきたこと</h3>'+msgs.map((x,i)=>`<span class="badge ${i%3===1?'gold':i%3===2?'lav':''}">${escapeHtml(x)}</span>`).join('')}
function download(name,text){const b=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}
$('exportBtn').onclick=()=>download(`イラッとわたし_バックアップ_${dateKey()}.json`,JSON.stringify(getData(),null,2));
$('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;setData(d);alert('バックアップを戻しました');renderTap();renderHistory();renderInsights()}catch(err){alert('読み込めませんでした')}};r.readAsText(f)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('main section').forEach(s=>s.classList.remove('show'));$(b.dataset.tab).classList.add('show');if(b.dataset.tab==='history')renderHistory();if(b.dataset.tab==='insight')renderInsights()});
renderTap();if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script>
</body></html>
